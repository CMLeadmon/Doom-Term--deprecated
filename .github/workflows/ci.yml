name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      # Clippy is a ratchet: the lints that predate its adoption are allowed by
      # name in the workspace Cargo.toml, so everything else is denied and new
      # code cannot add to that list without someone deciding to.
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Windows is a supported platform, not a tolerated one. A failure there
      # must be visible without taking the reference platform down with it.
      fail-fast: false
      matrix:
        include:
          - label: Linux (reference platform)
            os: ubuntu-latest
          - label: Windows
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          workspaces: |
            .
            src-tauri

      - name: Install dependencies
        run: npm ci

      # ── Portable gate. Everything below this line runs on both platforms. ──

      - name: Run Node test runner & Vitest suite
        run: npm test

      - name: Typecheck and build frontend
        run: npm run build

      # Pure-JS pixel maths over node:zlib, with no native canvas and no OS font
      # rasterisation, so the plate must come out byte-identical on both. If it
      # ever does not, that is a real finding rather than a platform excuse.
      - name: Compare HUD pixels with the reference
        run: npm run hud:check

      # ── Windows. ──────────────────────────────────────────────────────────

      # The PTY crate is where every Windows-specific implementation lives: the
      # process-tree foreground witness, the job object, the bounded subprocess
      # runner, and a ConPTY test that drives a real pseudoconsole end to end.
      #
      # `--all-targets` is not decoration. Plain `cargo check` skips test code,
      # and every Windows break found while writing this was IN a test: an
      # ungated std::os::unix import, and POSIX fixture programs in tests that
      # were never gated either.
      - name: Check the whole workspace for this platform
        if: runner.os == 'Windows'
        run: cargo check --locked --all-targets

      - name: Run PTY tests
        if: runner.os == 'Windows'
        run: cargo test --locked -p doom-term-pty

      # The backend's own suite is not run here yet. Two of its tests
      # (telemetry_tests, security_tests) drive $HOME and bwrap-isolated
      # profile mounts and are Linux-shaped in substance, not merely in
      # fixture. The backend's Windows-relevant logic — home_dir precedence,
      # the hostname fallback, the idle watch — is unit-tested on Linux, and
      # the step above proves the whole workspace compiles here. Extending the
      # suite is tracked separately rather than guessed at.

      # ── Linux, the reference platform. ────────────────────────────────────

      - name: Install browser and PTY test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y vim-tiny bubblewrap libevent-dev libncurses-dev bison pkg-config
          npx playwright install --with-deps chromium

      # Ubuntu's packaged tmux predates bracket_paste_flag (3.7). Pin the
      # tested release and verify GitHub's published asset digest before build.
      - name: Install child-paste-capable tmux
        if: runner.os == 'Linux'
        run: |
          DOOM_TMUX_BUILD="$(mktemp -d)"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/tmux/tmux/releases/download/3.7c/tmux-3.7c.tar.gz \
            --output "$DOOM_TMUX_BUILD/tmux.tar.gz"
          printf '%s  %s\n' \
            7c60cae9a0e25288e2e24750aafc9e8800fc7fd4555e447e1b29ee4201cfb3bf \
            "$DOOM_TMUX_BUILD/tmux.tar.gz" | sha256sum --check -
          tar --extract --gzip --file "$DOOM_TMUX_BUILD/tmux.tar.gz" --directory "$DOOM_TMUX_BUILD"
          cd "$DOOM_TMUX_BUILD/tmux-3.7c"
          ./configure --prefix="$DOOM_TMUX_BUILD/install"
          make -j2
          make install
          "$DOOM_TMUX_BUILD/install/bin/tmux" -V
          echo "$DOOM_TMUX_BUILD/install/bin" >> "$GITHUB_PATH"

      - name: Run PTY and backend tests
        if: runner.os == 'Linux'
        run: |
          # The telemetry fixture needs private profile/PID/network namespaces.
          # Ubuntu restricts unprofiled userns capabilities. Grant only the
          # installed helper its userns permission, and fail if isolation fails.
          sudo apparmor_parser --replace tools/ci/bwrap.apparmor
          /usr/bin/bwrap --unshare-pid --unshare-net --ro-bind / / --proc /proc --dev /dev /bin/true
          cargo test --locked

      - name: Exercise the browser with an isolated PTY daemon
        if: runner.os == 'Linux'
        run: npm run test:ui

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev

      # ── The desktop shell, on both platforms. ─────────────────────────────
      #
      # Doom Term is a desktop app first, so the shell that ships it has to
      # build. It was never checked here at all, and had drifted far enough
      # that its declared icons did not exist.
      #
      # Deliberately NOT Linux-only. src-tauri is excluded from the workspace
      # default members, so the `cargo check --all-targets` above never touches
      # it — and the Windows shell is the one users install. This is also what
      # proves the sidecar lands under the name the bundler demands
      # (`doom-term-server-x86_64-pc-windows-msvc.exe`); getting that wrong
      # fails at bundle time with a confusing "file not found".
      #
      # Windows needs no apt step: the WebView2 SDK and MSVC toolchain are
      # already on the runner.
      - name: Build the sidecar the desktop shell bundles
        run: npm run sidecar

      - name: Check Tauri shell compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
