name: Release

# Tag-driven. Pushing `v*` builds every platform and attaches the bundles to a
# GitHub release. `workflow_dispatch` builds the same matrix without publishing,
# which is the only way to find out whether a platform still compiles before a
# tag makes that question public.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Every target here is required. Windows was tolerated while it was
    # unproven; run 35125159582 built and bundled it on the first attempt, and
    # v0.1.0 ships its .msi and -setup.exe. A target that has succeeded must not
    # be allowed to fail quietly — `fail-fast: false` already keeps one failure
    # from cancelling its siblings, which is the part that was actually wanted.
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
          # Cross-compiled FROM Apple Silicon, deliberately. A dedicated
          # macos-13 runner sat queued for 20 minutes without ever starting —
          # GitHub's Intel macOS capacity is effectively gone. Xcode on an arm64
          # runner ships the x86_64 SDK, so the Intel slice builds here instead,
          # and the sidecar script already handles `--target` cross-compilation.
          - label: macOS (Intel)
            os: macos-14
            target: x86_64-apple-darwin
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Keyed on the target, not the runner: macos-13 and macos-14 are the same
      # OS with different architectures and must not share a cache entry.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            .
            src-tauri

      # Ubuntu 22.04 carries webkit2gtk 4.1, which is what Tauri 2 links.
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev \
            patchelf file desktop-file-utils

      - name: Install dependencies
        run: npm ci

      # Prove the code compiles for THIS target before spending a bundle on it.
      # The full `npm run agent:verify` gate is deliberately not re-run here: it
      # needs tmux 3.7, bubblewrap and the Linux-only HUD reference PNGs, and
      # ci.yml already runs it on every push to main. The tag points at a commit
      # that has passed it. Re-running it on four runners would only give an
      # environment difference the power to fail a release.
      - name: Typecheck and compile-check for this target
        run: |
          npm run typecheck
          cargo check --locked --target ${{ matrix.target }}

      # Fails closed. A tag whose version has no changelog section stops the
      # release here rather than publishing one with an empty body: the assets
      # are the part users cannot reconstruct, and the notes are the part that
      # tells them what they are installing.
      - name: Read the release notes from the changelog
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node tools/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
          {
            echo 'body<<DOOM_TERM_NOTES_EOF'
            cat release-notes.md
            echo 'DOOM_TERM_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and bundle the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy cannot mount its own AppImage inside a container-ish
          # runner; extracting is the supported way through.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          args: --target ${{ matrix.target }}
          # Only a tag publishes. A manual run builds and uploads nothing,
          # which is what makes it usable as a pre-tag smoke test.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Doom Term ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false

      - name: Upload bundles as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doom-term-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: ignore
          retention-days: 14

  # Everything a user can actually check about a download they did not build.
  #
  # Runs after every bundle job, over the assets as PUBLISHED rather than over
  # local build output — so the checksums describe the exact bytes people
  # receive, not something that was equal to them at some earlier point.
  provenance:
    name: Checksums and provenance
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance is signed through Sigstore with a short-lived certificate
      # issued to this workflow run; both of these are what let it claim an
      # identity at all.
      id-token: write
      attestations: write

    steps:
      - name: Download the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --dir assets --pattern '*'
          ls -l assets

      # Before SHA256SUMS exists, so the attestation covers the installers
      # themselves rather than a manifest describing them.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'assets/*'

      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
