[package]
name = "doom-term-pty"
version = "0.3.0"
edition = "2021"

[dependencies]
portable-pty = "0.8"
vte = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Already in the workspace lockfile as a transitive dependency; the remote
# enrichment frame is base64 because iTerm2's SetUserVar is.
base64 = "0.22"
parking_lot = "0.12"
anyhow = "1.0"
log = "0.4"
tempfile = "3.27"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "term"] }

# The process-tree foreground witness (`foreground/windows.rs`) and the job
# object that makes closing a pane close what it started. Already in the lock
# file by way of Tauri, so this costs nothing new on the Windows target and
# nothing at all on Linux or macOS.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # CreateJobObjectW takes a *const SECURITY_ATTRIBUTES, and windows-sys omits
    # any function whose signature reaches into a feature you did not enable.
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
