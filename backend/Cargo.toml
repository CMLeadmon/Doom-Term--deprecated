[package]
name = "doom-term-server"
version = "0.3.0"
edition = "2021"

[dependencies]
doom-term-pty = { path = "../crates/doom-term-pty" }
portable-pty = "0.8"
vte = "0.14"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
parking_lot = "0.12"
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.12"
log = "0.4"
env_logger = "0.11"
ureq = { version = "3.4", features = ["json"] }

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "term"] }

[lints]
workspace = true
