[package]
name = "doom-term"
version = "0.4.0"
description = "Doom Term: Agentic Coding Terminal Manager"
authors = ["cleadmon"]
edition = "2021"

[lib]
name = "doom_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
# Only for expand_path — the PTY itself runs in the bundled daemon.
doom-term-pty = { path = "../crates/doom-term-pty" }
# `devtools` keeps the Web Inspector available in RELEASE builds. Without it a
# webview error is invisible in a packaged app — there is no console to read and
# no way to tell "the frontend threw" from "the backend sent nothing". Worth the
# small binary cost for an app whose entire surface is a webview.
tauri = { version = "2.2", features = ["devtools"] }
tauri-plugin-shell = "2.2"
# Notifications were a Linux-only `notify-send` spawn behind a
# cfg(target_os = "linux"), so the command returned Ok(()) having done nothing
# on Windows and macOS. The official plugin is one implementation for all three
# rather than a second hand-rolled path per platform.
tauri-plugin-notification = "2.2"
# decorations:false alone loses window resize on Windows even with
# resizable:true (tauri-apps/tauri#8519), and takes Snap Layouts with it.
# decorum keeps both while the app draws its own bar. It is a window plugin,
# not an icon library: CLAUDE.md's prohibition is unaffected.
tauri-plugin-decorum = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"

[lints]
workspace = true
